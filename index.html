<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DebtMaster AI Pro</title>

<!-- Dependencies -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
body { font-family: 'Noto Sans Thai', sans-serif; background:#f8fafc; }
canvas { max-width:100%!important; }
@media print {.no-print{display:none}}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const Icon = ({ name, size = 20, className = "" }) => (
  <i data-lucide={name} className={className}
     style={{ width: size, height: size, display: "inline-block" }}></i>
);

const App = () => {
  /* ========= STATE ========= */
  const [debts, setDebts] = useState([]);
  const [income, setIncome] = useState("");
  const [essential, setEssential] = useState("");
  const [extraPayment, setExtraPayment] = useState(0);
  const [strategy, setStrategy] = useState("avalanche");
  const [tab, setTab] = useState("dashboard");
  const [premium, setPremium] = useState(false);

  const chartRef = useRef(null);

  /* ========= LOAD / SAVE ========= */
  useEffect(() => {
    const d = localStorage.getItem("dm_debts");
    const f = localStorage.getItem("dm_fin");
    if (d) setDebts(JSON.parse(d));
    if (f) {
      const j = JSON.parse(f);
      setIncome(j.i || "");
      setEssential(j.e || "");
      setExtraPayment(j.x || 0);
    }
  }, []);

  useEffect(() => {
    localStorage.setItem("dm_debts", JSON.stringify(debts));
    localStorage.setItem("dm_fin", JSON.stringify({
      i: income, e: essential, x: extraPayment
    }));
    if (window.lucide) window.lucide.createIcons();
  }, [debts, income, essential, extraPayment, tab, premium]);

  /* ========= CALC ========= */
